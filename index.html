<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arturo 2.0 - Centro Assistenza Digitale</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:#eef3f8;
    color:#1f2937;
}

/* =====================================
   HEADER
===================================== */

.hero{
    background:linear-gradient(135deg,#003b7a,#0056b3);
    color:white;
    text-align:center;
    padding:30px 20px;
}

.hero h1{
    margin:0;
    font-size:56px;
}

.subtitle{
    font-size:24px;
    font-weight:600;
}

.description{
    max-width:900px;
    margin:15px auto;
    line-height:1.7;
}

.reset-btn{
    border:none;
    background:#ff9800;
    color:white;
    padding:12px 20px;
    border-radius:30px;
    font-weight:bold;
    cursor:pointer;
}

/* =====================================
   CHAT
===================================== */

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.chat{
    background:white;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.messages{
    min-height:550px;
    padding:25px;
}

.bot{
    background:#eef5ff;
    border-left:5px solid #0056b3;
    padding:18px;
    border-radius:16px;
    margin-bottom:15px;
    max-width:90%;
    line-height:1.7;
}

.user{
    background:#e8f8e8;
    padding:18px;
    border-radius:16px;
    margin-bottom:15px;
    margin-left:auto;
    max-width:90%;
    text-align:right;
}

/* =====================================
   PULSANTI DINAMICI
===================================== */

.buttons-area{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:15px 0;
}

.dynamic-btn{
    border:none;
    background:#0056b3;
    color:white;
    padding:12px 18px;
    border-radius:30px;
    cursor:pointer;
    font-weight:600;
}

.dynamic-btn:hover{
    background:#003f85;
}

/* =====================================
   INPUT
===================================== */

.input-area{
    display:flex;
    gap:10px;
    padding:18px;
    border-top:1px solid #ddd;
}

.input-area input{
    flex:1;
    padding:15px;
    border:2px solid #d9e2ec;
    border-radius:15px;
    font-size:16px;
}

.input-area button{
    border:none;
    background:#0056b3;
    color:white;
    padding:15px 25px;
    border-radius:15px;
    cursor:pointer;
}

.footer{
    text-align:center;
    margin:20px;
    color:#6b7280;
}

@media(max-width:768px){

    .hero h1{
        font-size:42px;
    }

    .input-area{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="hero">

    <h1>🤖 Arturo</h1>

    <div class="subtitle">
        Centro Assistenza Digitale
    </div>

    <div class="description">

        Benvenuto in Arturo 2.0.

        <br><br>

        Posso aiutarti con informazioni sull'IIS Arturo Checchi,
        i servizi digitali, l'offerta formativa,
        la segreteria, la modulistica e molto altro.

    </div>

    <button
        class="reset-btn"
        onclick="resetConversazione()">

        🔄 Nuova Conversazione

    </button>

</div>

<div class="container">

    <div class="chat">

        <div
            class="messages"
            id="messages">
        </div>

        <div class="input-area">

            <input
                id="domanda"
                type="text"
                placeholder="Scrivi una domanda...">

            <button onclick="rispondi()">

                Invia

            </button>

        </div>

    </div>

</div>

<div class="footer">

    Arturo • Centro Assistenza Digitale • IIS Arturo Checchi

</div>

<script>

/* =====================================
   VARIABILI GLOBALI
===================================== */

let faqDatabase = [];
let timerReset = null;
let domandeNonRiconosciute = [];

/* =====================================
   CARICAMENTO JSON
===================================== */

fetch("faq.json")
.then(response => response.json())
.then(data => {

    faqDatabase = data;

    resetConversazione();

})
.catch(error => {

    console.error(error);

});

/* =====================================
   NORMALIZZAZIONE TESTO
===================================== */

function normalizza(testo){

    return testo
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[^\w\s]/g,"")
        .replace(/\s+/g," ")
        .trim();

}

/* =====================================
   MESSAGGI CHAT
===================================== */

function aggiungiMessaggio(tipo,testo){

    const box =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className = tipo;

    div.innerHTML = testo;

    box.appendChild(div);

    box.scrollTop =
        box.scrollHeight;

}

/* =====================================
   PULSANTI DINAMICI
===================================== */

function creaPulsanti(lista){

    const box =
        document.getElementById("messages");

    const area =
        document.createElement("div");

    area.className =
        "buttons-area";

    lista.forEach(voce => {

        const btn =
            document.createElement("button");

        btn.className =
            "dynamic-btn";

        btn.textContent =
            voce;

        btn.onclick = () => {

            selezionaVoce(voce);

        };

        area.appendChild(btn);

    });

    box.appendChild(area);

}

/* =====================================
   MENU PRINCIPALE
===================================== */

function mostraMenuPrincipale(){

    const menu = faqDatabase.filter(item =>

        item.id &&
        item.id.startsWith("MENU_") &&
        item.enabled === true

    );

    creaPulsanti(
        menu.map(
            item => item.title
        )
    );

}

/* =====================================
   RESET CHAT
===================================== */

function resetConversazione(){

    clearTimeout(timerReset);

    document
        .getElementById("messages")
        .innerHTML = "";

    aggiungiMessaggio(
        "bot",
        "<strong>👋 Benvenuto!</strong><br><br>Sono Arturo, il Centro Assistenza Digitale dell'IIS Arturo Checchi.<br><br>Come posso aiutarti?"
    );

    mostraMenuPrincipale();

}

/* =====================================
   TIMER INATTIVITA'
===================================== */

function avviaTimerReset(){

    clearTimeout(timerReset);

    timerReset = setTimeout(() => {

        resetConversazione();

        aggiungiMessaggio(
            "bot",
            "⌛ Conversazione reimpostata automaticamente per inattività."
        );

    },600000);

}

/* =====================================
   PRIVACY
===================================== */

function richiestaPrivacy(domanda){

    domanda =
        normalizza(domanda);

    const parole = [

        "mail di",
        "email di",
        "telefono di",
        "cellulare di",
        "dove lavora",
        "dove insegna",
        "fascicolo",
        "cartella",
        "documenti personali",
        "dati personali"

    ];

    return parole.some(
        parola =>
        domanda.includes(parola)
    );

}

/* =====================================
   CALCOLATRICE
===================================== */

function eseguiCalcolo(testo){

    try{

        if(
            /^[0-9+\-*/(). ]+$/.test(testo)
        ){

            const risultato =
                Function(
                    "return (" +
                    testo +
                    ")"
                )();

            return "🧮 Risultato: " +
                risultato;

        }

    }catch(e){}

    return null;

}

/* =====================================
   LEVENSHTEIN
===================================== */

function distanzaLevenshtein(a,b){

    const matrix = [];

    for(let i=0;i<=b.length;i++){
        matrix[i]=[i];
    }

    for(let j=0;j<=a.length;j++){
        matrix[0][j]=j;
    }

    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            if(
                b.charAt(i-1)===
                a.charAt(j-1)
            ){

                matrix[i][j] =
                    matrix[i-1][j-1];

            }else{

                matrix[i][j] = Math.min(

                    matrix[i-1][j-1]+1,

                    matrix[i][j-1]+1,

                    matrix[i-1][j]+1

                );

            }

        }

    }

    return matrix[b.length][a.length];

}

/* =====================================
   RICERCA FAQ
===================================== */

function cercaFAQ(domanda){

    domanda =
        normalizza(domanda);

    let migliorFaq = null;
    let migliorPunteggio = 0;

    faqDatabase.forEach(faq => {

        if(!faq.keywords){
            return;
        }

        faq.keywords.forEach(keyword => {

            keyword =
                normalizza(keyword);

            if(
                domanda.includes(keyword)
            ){

                migliorFaq =
                    faq;

                migliorPunteggio =
                    1;

                return;

            }

            const distanza =
                distanzaLevenshtein(
                    domanda,
                    keyword
                );

            const lunghezza =
                Math.max(
                    domanda.length,
                    keyword.length
                );

            const punteggio =
                1 -
                (
                    distanza /
                    lunghezza
                );

            if(
                punteggio >
                migliorPunteggio
            ){

                migliorPunteggio =
                    punteggio;

                migliorFaq =
                    faq;

            }

        });

    });

    if(
        migliorPunteggio >= 0.75
    ){

        return migliorFaq;

    }

    return null;

}

/* =====================================
   VISUALIZZA FAQ
===================================== */

function mostraVoce(voce){

    if(voce.responses){

        aggiungiMessaggio(
            "bot",
            voce.responses[
                Math.floor(
                    Math.random() *
                    voce.responses.length
                )
            ]
        );

    }

    if(
        voce.followup &&
        voce.followup.message
    ){

        aggiungiMessaggio(
            "bot",
            voce.followup.message
        );

    }

    if(
        voce.followup &&
        voce.followup.buttons
    ){

        creaPulsanti(
            voce.followup.buttons
        );

    }

}

/* =====================================
   CLICK PULSANTI
===================================== */

function selezionaVoce(testo){

    aggiungiMessaggio(
        "user",
        testo
    );

    const voce =
        faqDatabase.find(
            item =>
            item.title === testo
        );

    if(voce){

        mostraVoce(voce);

    }

    avviaTimerReset();

}

/* =====================================
   RISPOSTA UTENTE
===================================== */

function rispondi(){

    const input =
        document.getElementById("domanda");

    const testo =
        input.value.trim();

    if(!testo){
        return;
    }

    avviaTimerReset();

    aggiungiMessaggio(
        "user",
        testo
    );

    if(
        richiestaPrivacy(testo)
    ){

        aggiungiMessaggio(
            "bot",
            "🔒 Non posso fornire dati personali o informazioni riservate riferite a studenti, famiglie o personale."
        );

        input.value = "";

        return;

    }

    const calcolo =
        eseguiCalcolo(testo);

    if(calcolo){

        aggiungiMessaggio(
            "bot",
            calcolo
        );

        input.value = "";

        return;

    }

    const faq =
        cercaFAQ(testo);

    if(faq){

        mostraVoce(faq);

    }else{

        domandeNonRiconosciute.push(
            testo
        );

        aggiungiMessaggio(
            "bot",
            "🤖 Non ho ancora una risposta per questa richiesta. La tua domanda mi aiuterà a migliorare."
        );

    }

    input.value = "";

}

/* =====================================
   TASTO ENTER
===================================== */

document
.getElementById("domanda")
.addEventListener(
    "keypress",
    function(event){

        if(
            event.key === "Enter"
        ){

            rispondi();

        }

    }
);

</script>

</body>
</html>
